<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Amazon - E-Commerce</title>

    <style>

        /* =========================
           GENERAL
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eaeded;
            color: #222;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            background: #131921;
            color: white;

            min-height: 65px;
            padding: 10px 4%;

            display: flex;
            align-items: center;
            gap: 25px;

            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            color: #ff9900;
            font-size: 25px;
            font-weight: bold;
            white-space: nowrap;
        }

        .search-box {
            flex: 1;
            display: flex;
            height: 40px;
        }

        .search-box input {
            width: 100%;
            border: none;
            outline: none;

            padding: 0 15px;
            font-size: 15px;
        }

        .search-box button {
            width: 50px;
            border: none;
            background: #febd69;
            cursor: pointer;
            font-size: 18px;
        }

        .cart-button {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 16px;
            white-space: nowrap;
        }


        /* =========================
           NAVIGATION
        ========================= */

        nav {
            background: #232f3e;
            color: white;

            padding: 13px 4%;

            display: flex;
            gap: 30px;
        }

        nav span {
            cursor: pointer;
            font-size: 15px;
        }

        nav span:hover {
            color: #ff9900;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 92%;
            max-width: 1250px;
            margin: 25px auto;
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            background: linear-gradient(
                135deg,
                #ffb347,
                #ffd27f
            );

            padding: 40px 20px;
            border-radius: 10px;

            text-align: center;

            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
        }


        /* =========================
           SECTION TITLE
        ========================= */

        .section-title {
            font-size: 28px;
            margin-bottom: 20px;
        }


        /* =========================
           PRODUCT GRID
        ========================= */

        .products {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;
        }


        /* =========================
           PRODUCT CARD
        ========================= */

        .product-card {
            background: white;

            border-radius: 10px;

            padding: 15px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.10);

            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 7px 20px rgba(0,0,0,0.18);
        }


        /* =========================
           PRODUCT IMAGE
        ========================= */

        .product-image {
            width: 100%;
            height: 190px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f7f7f7;

            border-radius: 8px;

            margin-bottom: 15px;

            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }


        /* =========================
           PRODUCT DETAILS
        ========================= */

        .product-card h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .rating {
            color: #f59e0b;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .price {
            font-size: 21px;
            font-weight: bold;

            margin-bottom: 12px;
        }


        /* =========================
           PRODUCT BUTTONS
        ========================= */

        .product-buttons {
            display: flex;
            gap: 8px;
        }

        .product-buttons button {
            flex: 1;

            padding: 10px;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-size: 14px;
        }

        .details-btn {
            background: #e7e7e7;
        }

        .add-btn {
            background: #ffd814;
        }

        .details-btn:hover {
            background: #d5d5d5;
        }

        .add-btn:hover {
            background: #f7ca00;
        }


        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.65);

            z-index: 2000;

            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .modal-content {
            width: 90%;
            max-width: 700px;

            background: white;

            border-radius: 12px;

            padding: 25px;

            position: relative;

            display: flex;

            gap: 25px;
        }

        .modal-image {
            width: 280px;
            height: 280px;

            object-fit: cover;

            border-radius: 10px;
        }

        .modal-info {
            flex: 1;
            padding-top: 15px;
        }

        .modal-info h2 {
            font-size: 25px;
            margin-bottom: 15px;
        }

        .modal-info p {
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .modal-price {
            font-size: 26px;
            font-weight: bold;

            margin-bottom: 20px;
        }

        .modal-add {
            padding: 12px 25px;

            border: none;

            background: #ffd814;

            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;
        }

        .close {
            position: absolute;

            right: 15px;
            top: 8px;

            font-size: 30px;

            cursor: pointer;

            color: #555;
        }

        .close:hover {
            color: red;
        }


        /* =========================
           CART
        ========================= */

        #cartSection {
            display: none;
        }

        .cart-box {
            background: white;

            padding: 25px;

            border-radius: 10px;
        }

        .cart-box h2 {
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;

            align-items: center;

            gap: 20px;

            padding: 15px 0;

            border-bottom: 1px solid #ddd;
        }

        .cart-item img {
            width: 100px;
            height: 100px;

            object-fit: cover;

            border-radius: 8px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-info h3 {
            margin-bottom: 8px;
        }

        .cart-item-info p {
            font-weight: bold;
        }


        /* =========================
           QUANTITY
        ========================= */

        .quantity {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 10px;
        }

        .quantity button {
            width: 32px;
            height: 32px;

            border: none;

            background: #ddd;

            border-radius: 4px;

            cursor: pointer;

            font-size: 18px;
        }

        .quantity button:hover {
            background: #ccc;
        }


        /* =========================
           REMOVE BUTTON
        ========================= */

        .remove-btn {
            background: #dc2626;

            color: white;

            border: none;

            padding: 9px 14px;

            border-radius: 5px;

            cursor: pointer;
        }

        .remove-btn:hover {
            background: #b91c1c;
        }


        /* =========================
           CART TOTAL
        ========================= */

        .cart-total {
            text-align: right;

            font-size: 24px;

            font-weight: bold;

            margin-top: 25px;
        }

        .checkout-btn {
            display: block;

            margin-left: auto;
            margin-top: 15px;

            background: #ff9900;

            border: none;

            padding: 12px 25px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;
        }

        .checkout-btn:hover {
            background: #e88a00;
        }

        .empty-cart {
            text-align: center;

            padding: 40px;

            color: #777;

            font-size: 20px;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #131921;

            color: white;

            text-align: center;

            padding: 25px;

            margin-top: 50px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1000px) {

            .products {
                grid-template-columns:
                    repeat(3, 1fr);
            }

        }


        @media (max-width: 750px) {

            header {
                flex-wrap: wrap;
            }

            .search-box {
                order: 3;
                flex-basis: 100%;
            }

            .products {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .modal-content {
                flex-direction: column;

                max-height: 90vh;

                overflow-y: auto;
            }

            .modal-image {
                width: 100%;
                height: 220px;
            }

        }


        @media (max-width: 500px) {

            nav {
                gap: 15px;

                overflow-x: auto;
            }

            nav span {
                white-space: nowrap;
            }

            .products {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 27px;
            }

            .cart-item {
                flex-wrap: wrap;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <div class="logo">
            Mini Amazon
        </div>


        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
            >

            <button onclick="searchProducts()">
                🔍
            </button>

        </div>


        <button
            class="cart-button"
            onclick="showCart()"
        >

            🛒 Cart
            (<span id="cartCount">0</span>)

        </button>

    </header>


    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav>

        <span onclick="showHome()">
            Home
        </span>

        <span onclick="filterCategory('Electronics')">
            Electronics
        </span>

        <span onclick="filterCategory('Fashion')">
            Fashion
        </span>

        <span onclick="filterCategory('Books')">
            Books
        </span>

        <span onclick="filterCategory('Accessories')">
            Accessories
        </span>

    </nav>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="container">


        <!-- HERO -->

        <section class="hero">

            <h1>
                Welcome to Mini Amazon
            </h1>

            <p>
                Everything you need, all in one place!
            </p>

        </section>


        <!-- =========================
             HOME SECTION
        ========================= -->

        <section id="homeSection">

            <h2 class="section-title">
                Popular Products
            </h2>


            <div
                class="products"
                id="productContainer"
            >

            </div>

        </section>


        <!-- =========================
             CART SECTION
        ========================= -->

        <section id="cartSection">

            <div class="cart-box">

                <h2>
                    🛒 Shopping Cart
                </h2>


                <div id="cartItems">

                </div>


                <div class="cart-total">

                    Total: ₹
                    <span id="cartTotal">
                        0
                    </span>

                </div>


                <button
                    class="checkout-btn"
                    onclick="checkout()"
                >
                    Proceed to Checkout
                </button>

            </div>

        </section>

    </main>


    <!-- =========================
         PRODUCT DETAILS POPUP
    ========================= -->

    <div
        class="modal"
        id="productModal"
    >

        <div class="modal-content">


            <span
                class="close"
                onclick="closeModal()"
            >
                &times;
            </span>


            <img
                id="modalImage"
                class="modal-image"
                src=""
                alt="Product"
            >


            <div class="modal-info">

                <h2 id="modalTitle">
                </h2>


                <p id="modalDescription">
                </p>


                <div class="modal-price">

                    ₹<span id="modalPrice">
                    </span>

                </div>


                <button
                    class="modal-add"
                    id="modalAddButton"
                >
                    Add to Cart
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <p>
            © 2026 Mini Amazon | E-Commerce Front-End Project
        </p>

    </footer>



    <script>


        /* ==================================
           PRODUCT DATA
        ================================== */

        const products = [

            {
                id: 1,

                name: "Wireless Headphones",

                price: 1499,

                category: "Electronics",

                image:
                "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80",

                description:
                "High-quality wireless headphones with clear sound and comfortable design."
            },


            {
                id: 2,

                name: "Smart Watch",

                price: 2499,

                category: "Electronics",

                image:
                "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80",

                description:
                "Smart watch with fitness tracking, notifications and stylish design."
            },


            {
                id: 3,

                name: "Running Shoes",

                price: 1999,

                category: "Fashion",

                image:
                "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80",

                description:
                "Comfortable running shoes suitable for sports and everyday activities."
            },


            {
                id: 4,

                name: "Casual T-Shirt",

                price: 699,

                category: "Fashion",

                image:
                "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=600&q=80",

                description:
                "Soft and comfortable casual T-shirt with a modern design."
            },


            {
                id: 5,

                name: "Programming Book",

                price: 899,

                category: "Books",

                image:
                "https://images.unsplash.com/photo-1515879218367-8466d910aaa4?auto=format&fit=crop&w=600&q=80",

                description:
                "Learn programming concepts and improve your coding skills."
            },


            {
                id: 6,

                name: "Laptop Backpack",

                price: 1299,

                category: "Accessories",

                image:
                "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80",

                description:
                "Durable laptop backpack with multiple compartments."
            },


            {
                id: 7,

                name: "Bluetooth Speaker",

                price: 1199,

                category: "Electronics",

                image:
                "https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=600&q=80",

                description:
                "Portable Bluetooth speaker with powerful sound."
            },


            {
                id: 8,

                name: "Classic Watch",

                price: 1599,

                category: "Accessories",

                image:
                "https://images.unsplash.com/photo-1524805444758-089113d48a6d?auto=format&fit=crop&w=600&q=80",

                description:
                "Classic and elegant watch suitable for everyday use."
            }

        ];



        /* ==================================
           CART
        ================================== */

        let cart =
            JSON.parse(
                localStorage.getItem("miniAmazonCart")
            ) || [];



        /* ==================================
           DISPLAY PRODUCTS
        ================================== */

        function displayProducts(productList = products) {

            const container =
                document.getElementById(
                    "productContainer"
                );


            container.innerHTML = "";


            if (productList.length === 0) {

                container.innerHTML = `
                    <p>
                        No products found.
                    </p>
                `;

                return;
            }


            productList.forEach(product => {


                const card =
                    document.createElement("div");


                card.className =
                    "product-card";


                card.innerHTML = `

                    <div class="product-image">

                        <img
                            src="${product.image}"
                            alt="${product.name}"
                        >

                    </div>


                    <h3>
                        ${product.name}
                    </h3>


                    <div class="rating">
                        ⭐⭐⭐⭐⭐
                    </div>


                    <div class="price">
                        ₹${product.price}
                    </div>


                    <div class="product-buttons">

                        <button
                            class="details-btn"
                            onclick="showDetails(${product.id})"
                        >
                            Details
                        </button>


                        <button
                            class="add-btn"
                            onclick="addToCart(${product.id})"
                        >
                            Add to Cart
                        </button>

                    </div>

                `;


                container.appendChild(card);

            });

        }



        /* ==================================
           ADD TO CART
        ================================== */

        function addToCart(productId) {


            const product =
                products.find(
                    p => p.id === productId
                );


            const existing =
                cart.find(
                    item => item.id === productId
                );


            if (existing) {

                existing.quantity++;

            }

            else {

                cart.push({

                    ...product,

                    quantity: 1

                });

            }


            saveCart();


            alert(
                product.name +
                " added to cart!"
            );

        }



        /* ==================================
           SAVE CART
        ================================== */

        function saveCart() {


            localStorage.setItem(

                "miniAmazonCart",

                JSON.stringify(cart)

            );


            updateCartCount();

        }



        /* ==================================
           UPDATE CART COUNT
        ================================== */

        function updateCartCount() {


            let count = 0;


            cart.forEach(item => {

                count += item.quantity;

            });


            document.getElementById(
                "cartCount"
            ).textContent = count;

        }



        /* ==================================
           SHOW CART
        ================================== */

        function showCart() {


            document.getElementById(
                "homeSection"
            ).style.display = "none";


            document.getElementById(
                "cartSection"
            ).style.display = "block";


            displayCart();

        }



        /* ==================================
           SHOW HOME
        ================================== */

        function showHome() {


            document.getElementById(
                "homeSection"
            ).style.display = "block";


            document.getElementById(
                "cartSection"
            ).style.display = "none";


            displayProducts();

        }



        /* ==================================
           DISPLAY CART
        ================================== */

        function displayCart() {


            const container =
                document.getElementById(
                    "cartItems"
                );


            container.innerHTML = "";


            if (cart.length === 0) {


                container.innerHTML = `

                    <div class="empty-cart">

                        Your cart is empty 🛒

                    </div>

                `;


                document.getElementById(
                    "cartTotal"
                ).textContent = "0";


                return;

            }


            let total = 0;


            cart.forEach(item => {


                total +=
                    item.price *
                    item.quantity;


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "cart-item";


                div.innerHTML = `

                    <img
                        src="${item.image}"
                        alt="${item.name}"
                    >


                    <div class="cart-item-info">

                        <h3>
                            ${item.name}
                        </h3>


                        <p>
                            ₹${item.price}
                        </p>


                        <div class="quantity">

                            <button
                                onclick="changeQuantity(${item.id}, -1)"
                            >
                                −
                            </button>


                            <span>
                                ${item.quantity}
                            </span>


                            <button
                                onclick="changeQuantity(${item.id}, 1)"
                            >
                                +
                            </button>

                        </div>

                    </div>


                    <button
                        class="remove-btn"
                        onclick="removeFromCart(${item.id})"
                    >
                        Remove
                    </button>

                `;


                container.appendChild(div);

            });


            document.getElementById(
                "cartTotal"
            ).textContent = total;

        }



        /* ==================================
           CHANGE QUANTITY
        ================================== */

        function changeQuantity(
            id,
            change
        ) {


            const item =
                cart.find(
                    product =>
                    product.id === id
                );


            if (!item) return;


            item.quantity += change;


            if (item.quantity <= 0) {

                cart =
                    cart.filter(
                        product =>
                        product.id !== id
                    );

            }


            saveCart();


            displayCart();

        }



        /* ==================================
           REMOVE FROM CART
        ================================== */

        function removeFromCart(id) {


            cart =
                cart.filter(
                    product =>
                    product.id !== id
                );


            saveCart();


            displayCart();

        }



        /* ==================================
           PRODUCT DETAILS
        ================================== */

        function showDetails(id) {


            const product =
                products.find(
                    p => p.id === id
                );


            document.getElementById(
                "modalImage"
            ).src = product.image;


            document.getElementById(
                "modalTitle"
            ).textContent =
                product.name;


            document.getElementById(
                "modalDescription"
            ).textContent =
                product.description;


            document.getElementById(
                "modalPrice"
            ).textContent =
                product.price;


            document.getElementById(
                "modalAddButton"
            ).onclick = function() {


                addToCart(product.id);


                closeModal();

            };


            document.getElementById(
                "productModal"
            ).style.display = "flex";

        }



        /* ==================================
           CLOSE MODAL
        ================================== */

        function closeModal() {


            document.getElementById(
                "productModal"
            ).style.display = "none";

        }



        /* ==================================
           SEARCH
        ================================== */

        function searchProducts() {


            const search =
                document.getElementById(
                    "searchInput"
                ).value
                .toLowerCase()
                .trim();


            const filtered =
                products.filter(
                    product =>

                    product.name
                        .toLowerCase()
                        .includes(search)

                    ||

                    product.category
                        .toLowerCase()
                        .includes(search)

                );


            showHome();


            displayProducts(filtered);

        }



        /* ==================================
           SEARCH WHILE TYPING
        ================================== */

        document.getElementById(
            "searchInput"
        ).addEventListener(
            "keyup",
            searchProducts
        );



        /* ==================================
           CATEGORY FILTER
        ================================== */

        function filterCategory(category) {


            const filtered =
                products.filter(
                    product =>
                    product.category === category
                );


            showHome();


            displayProducts(filtered);

        }



        /* ==================================
           CHECKOUT
        ================================== */

        function checkout() {


            if (cart.length === 0) {

                alert(
                    "Your cart is empty!"
                );

                return;

            }


            alert(
                "Thank you for shopping with Mini Amazon! 😊"
            );

        }



        /* ==================================
           CLOSE MODAL OUTSIDE
        ================================== */

        window.onclick =
            function(event) {


                const modal =
                    document.getElementById(
                        "productModal"
                    );


                if (
                    event.target === modal
                ) {

                    closeModal();

                }

            };



        /* ==================================
           INITIAL LOAD
        ================================== */

        displayProducts();


        updateCartCount();

    </script>

</body>

</html>
